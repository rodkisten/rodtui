[package]
name = "rodtui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A composable terminal UI CLI powered by Ratatui"
license = "MIT"
repository = "https://github.com/rodkisten/rodtui"

[dependencies]
ratatui = "0.30.0"
