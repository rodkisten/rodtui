[package]
name = "rodtui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A composable terminal UI CLI powered by Ratatui"
license = "MIT"
repository = "https://github.com/rodkisten/rodtui"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
