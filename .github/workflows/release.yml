name: 🦀 Release Binaries

run-name: >
  🦀 Release: ${{
    github.event_name == 'workflow_dispatch' && format('Manual · {0}', github.ref_name) ||
    format('{0} · {1}', github.ref_name, github.event.head_commit.message)
  }}

# Dispara apenas em tags de versão (v*) ou manualmente via workflow_dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: 🦀 Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (musl estático + pacotes .deb)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            deb: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            deb: true

          # Android
          - os: ubuntu-latest
            target: aarch64-linux-android
            use_cross: true
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            use_cross: true

          # macOS (Intel & Apple Silicon)
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: 🦀 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Read Cargo.toml version
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 🦀 Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 🦀 Install Linux cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu gcc-riscv64-linux-gnu

      - name: 🦀 Install cross (for Android targets)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: 🦀 Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}" --bin rodtui
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin rodtui
          fi

      - name: 🦀 Install cargo-deb
        if: matrix.deb == true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: 🦀 Build .deb package
        if: matrix.deb == true
        shell: bash
        run: |
          mkdir -p dist
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" --output "dist/rodtui_${{ steps.meta.outputs.version }}_${{ matrix.target }}.deb"

      - name: 🦀 Package (*nix .tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/rodtui" dist/stage/rodtui
          for doc in README.md LICENSE CHANGELOG.md; do
            [ -f "$doc" ] && cp "$doc" dist/stage/
          done
          tar -czf "dist/rodtui-${{ steps.meta.outputs.version }}-${{ matrix.target }}.tar.gz" -C dist/stage .

      - name: 🦀 Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rodtui.exe" dist/stage/rodtui.exe
          foreach ($doc in @("README.md", "LICENSE", "CHANGELOG.md")) {
            if (Test-Path $doc) { Copy-Item $doc dist/stage/ }
          }
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/rodtui-${{ steps.meta.outputs.version }}-${{ matrix.target }}.zip"

      - name: 🦀 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
          if-no-files-found: error

  publish:
    name: 🦀 Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 🦀 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: 🦀 Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum rodtui-* > SHA256SUMS

      - name: 🦀 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
