name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation and installer syntax
        run: |
          test -s README.md
          test -s ARCHITECTURE.md
          test -s docs/PROGRESS.md
          sh -n install.sh
      - name: Detect Rust workspace
        id: workspace
        run: |
          if test -f Cargo.toml; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.workspace.outputs.exists == 'true'
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        if: steps.workspace.outputs.exists == 'true'
        run: cargo fmt --all -- --check
      - name: Rust lint
        if: steps.workspace.outputs.exists == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        if: steps.workspace.outputs.exists == 'true'
        run: cargo test --workspace --locked
      - name: Interactive chooser with a controlling terminal
        if: steps.workspace.outputs.exists == 'true'
        run: |
          cargo build --locked
          python3 tests/choose_pty.py target/debug/rodtui
          python3 tests/forms_pty.py target/debug/rodtui
      - name: Rust release build
        if: steps.workspace.outputs.exists == 'true'
        run: cargo build --release --locked
